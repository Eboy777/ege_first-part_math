{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пятёрка · ЕГЭ-2026</title><link rel="stylesheet" href="{% static 'design-system/design-system.css' %}"><style>body{margin:0;background:#faf9f6;color:#202020;font-family:Inter,Arial,sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}header a{color:inherit}header form{margin-left:auto}h1{font-size:clamp(28px,5vw,48px)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{padding:24px;border:1px solid #ddd;border-radius:20px;background:white;margin:16px 0;display:block;color:inherit;text-decoration:none;overflow-wrap:anywhere}.card:hover{border-color:#444}.small{color:#626262;font-size:14px}.segments{display:flex;gap:5px;margin-top:12px}.segments i{height:9px;width:35px;border-radius:4px;background:#e5e5e5}.segments i.done{background:#a8d8a9}button{padding:12px 20px;border-radius:12px;border:1px solid #333;background:#dbefbd;cursor:pointer}input{display:block;padding:12px;margin:10px 0 20px;max-width:100%;box-sizing:border-box}.task-image{display:block;max-width:100%;height:auto;margin:20px auto}a{color:#354a34}main{padding-bottom:70px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}.scroll{overflow-x:auto}.source-statement{font-size:18px;line-height:1.8}.source-statement .formula{display:inline-block;vertical-align:middle;max-width:100%;height:auto}.source-statement .illustration{display:block;max-width:100%;height:auto;margin:20px auto}</style></head><body><header><a href="{% url 'home' %}"><strong>Пятёрка ↗</strong></a>{% if user.is_authenticated %}<a href="{% url 'bank-status' %}">Наполнение банка</a><span>{{ user.first_name|default:user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
